# Blueprint: https://render.com/docs/blueprint-spec
# Connect this repo in Render → New → Blueprint.
# Set secret env vars in the dashboard after first sync (DATABASE_URL, REDIS_URL, JWT_SECRET, etc.).
#
# Free tier: only a web service. The BullMQ consumer runs inside the API process
# (see apps/api/src/submission-worker.ts). A separate background worker is not available on free.

services:
  - type: web
    name: webform-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install && npm run db:generate && npm run db:migrate:deploy
    startCommand: npm run start -w @webform/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
