# Keeps the Render free-tier API from sleeping by hitting /health regularly.
# Render spins down after ~15 minutes of inactivity; this ping runs every 10 minutes.
#
# Optional repo secret: RENDER_HEALTH_URL
#   Example: https://webform-api.onrender.com/health
# If unset, defaults to https://webform-api.onrender.com/health

name: Keep Render API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          URL="${{ secrets.RENDER_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://webform-api.onrender.com/health"
          fi
          echo "Pinging $URL"
          curl -fsS --max-time 60 "$URL"
          echo
          echo "OK"
